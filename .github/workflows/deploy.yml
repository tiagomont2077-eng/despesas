name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; se chegar outra, ela espera a atual terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # O site nao tem build: publicamos a raiz do repositorio como esta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v4
